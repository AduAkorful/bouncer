[package]
name = "guard"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bouncer door guard. Ledger, chat, and the verdict signature. No payout key."

[lib]
name = "guard"
path = "src/lib.rs"

[[bin]]
name = "guard"
path = "src/main.rs"

[dependencies]
borsh = { version = "1.8.1", features = ["derive"] }
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
getrandom = "0.2"
outlayer = { version = "0.2.1", features = ["signing-keys", "encryption-keys"] }
wasi-http-client = "0.2.1"
wasi = "0.13.0"

[dev-dependencies]
wasi = "0.13.0"
ed25519-dalek = "2"
